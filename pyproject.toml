[project]
name = "agent-harness"
version = "0.1.0"
description = "A minimal agent harness in Python, in the spirit of Claude Code."
readme = "README.md"
authors = [
    { name = "Thomas Auinger", email = "thomas@auinger.de" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harness"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
